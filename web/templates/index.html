<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Выбор таблицы</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 20px;
    }

    .table-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    .table-button {
      min-width: 150px;
      padding: 12px 20px;
      font-weight: bold;
      font-size: 16px;
      border-radius: 15px;
      background: linear-gradient(145deg, #00c6ff, #0072ff);
      border: none;
      color: white;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 15px rgba(0, 150, 255, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .table-button:hover {
      background: linear-gradient(145deg, #0072ff, #00c6ff);
      box-shadow: 0 0 25px rgba(0, 150, 255, 0.7);
      transform: scale(1.08);
    }

    .image-wrapper {
      margin-bottom: 25px;
    }

    .image-wrapper img {
      max-width: 500px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
    }

    h1 {
      font-size: 2.7rem;
      font-weight: 700;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
    }

    .logout {
      margin-top: 30px;
    }

    .logout a {
      color: white;
      text-decoration: underline;
      opacity: 0.7;
      font-size: 16px;
    }

    .logout a:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="image-wrapper">
    <img src="{{ url_for('static', filename='mega_kruto.png') }}" alt="Логотип">
  </div>

  <h1 class="display-5 fw-bold mb-4">Выберите таблицу</h1>

  <div class="table-buttons">
    {% for table in tables %}
      <a href="{{ url_for('show_table', table=table) }}" class="table-button">{{ table }}</a>
    {% endfor %}
  </div>

<div class="logout">
  <a href="{{ url_for('logout') }}" class="table-button">Выйти</a>
</div>


</body>
</html>
