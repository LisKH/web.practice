<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box img {
      max-width: 120px;
      margin-bottom: 20px;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .form-control {
      margin-bottom: 15px;
    }

    .btn-login {
      background: linear-gradient(145deg, #00c6ff, #0072ff);
      border: none;
      font-weight: bold;
    }

    .btn-login:hover {
      background: linear-gradient(145deg, #0072ff, #00c6ff);
    }

    .error {
      color: #ffaaaa;
      margin-bottom: 15px;
    }

    .timer-box {
      margin-top: 15px;
      color: #ffdd88;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="{{ url_for('static', filename='mini tralalero.png') }}" alt="Логотип">
    <h2 class="mb-4">Авторизация</h2>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <input type="text" class="form-control" name="login" placeholder="Логин" required {% if wait_time %}disabled{% endif %}>
      <input type="password" class="form-control" name="password" placeholder="Пароль" required {% if wait_time %}disabled{% endif %}>
      <button type="submit" class="btn btn-login w-100 mt-2" {% if wait_time %}disabled{% endif %}>Войти</button>
    </form>

    {% if wait_time %}
      <div class="timer-box">
        Повторите попытку через <span id="countdown">{{ wait_time }}</span> сек.
      </div>
      <script>
        let timeLeft = {{ wait_time }};
        const countdown = document.getElementById('countdown');

        const timer = setInterval(() => {
          timeLeft--;
          countdown.textContent = timeLeft;
          if (timeLeft <= 0) {
            clearInterval(timer);
            location.reload();
          }
        }, 1000);
      </script>
    {% endif %}
  </div>

</body>
</html>
